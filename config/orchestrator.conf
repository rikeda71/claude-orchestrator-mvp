# Claude Orchestrator システム設定
# このファイルはオーケストレーター自体の設定を定義します

# オーケストレーターのルートディレクトリ（通常は自動設定されます）
# ORCHESTRATOR_ROOT="/Users/rikeda/ghq/github.com/rikeda71/claude-orchestrator"

# tmuxセッション名のプレフィックス
TMUX_SESSION_PREFIX="claude"

# 通信パイプのディレクトリ
# PIPE_DIR="${ORCHESTRATOR_ROOT}/communication/pipes"

# ログディレクトリ
# LOG_DIR="${ORCHESTRATOR_ROOT}/communication/logs"

# タスク管理ディレクトリ
# TASK_DIR="${ORCHESTRATOR_ROOT}/tasks"

# Gitワークツリーのベースディレクトリ
# WORKTREE_BASE="${ORCHESTRATOR_ROOT}/worktrees"

# ログレベル（0=DEBUG, 1=INFO, 2=WARN, 3=ERROR）
LOG_LEVEL=1

# セッションタイムアウト（秒）
SESSION_TIMEOUT=300

# メッセージクリーンアップ間隔（分）
MESSAGE_CLEANUP_INTERVAL=60

# タスクバックアップ間隔（分）
TASK_BACKUP_INTERVAL=30

# コンテキスト使用率の警告閾値（%）
CONTEXT_WARNING_THRESHOLD=95

# 自動保存の有効化
AUTO_SAVE_ENABLED=true

# ============================================
# Phase 2: 並列エンジニアリング設定
# ============================================

# デフォルトのエンジニア数（Phase 1との互換性のため1）
DEFAULT_ENGINEERS=1

# 最大エンジニア数（システムリソースの上限）
MAX_ENGINEERS=10
